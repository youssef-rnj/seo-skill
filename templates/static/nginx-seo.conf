# nginx — one canonical HTTPS host, security headers, cache for static files.
# Replace example.com and the certificate paths. High-impact file: follow references/change-safety.md.
# Test with `nginx -t` before `nginx -s reload`; keep a copy of the previous file to roll back.
#
# add_header is inherited from the server block ONLY by locations that have no add_header of their own.
# Every location below that adds a header therefore includes the shared headers again.
# (nginx >= 1.29.3 can use `add_header_inherit merge;` instead.)
#
# Put these lines in /etc/nginx/snippets/seo-headers.conf:
#   # HSTS ramp: 300 → 604800 → 31536000. includeSubDomains only after every subdomain answers HTTPS.
#   # Never add preload by default (hard to undo, see hstspreload.org).
#   add_header Strict-Transport-Security "max-age=300" always;
#   add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
#   add_header X-Content-Type-Options "nosniff" always;
#   # Report-only CSP: add `report-uri /csp-report` with a logging endpoint, or check the browser console.
#   add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

server_tokens off;

# http (both hosts) → https canonical
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

# https www → https canonical
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/nginx/snippets/seo-headers.conf;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/example/current;
    index index.html;

    include /etc/nginx/snippets/seo-headers.conf;

    # Private area: never indexed. Protect with authentication too.
    location ^~ /admin {
        include /etc/nginx/snippets/seo-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /app.html;
    }

    # Hashed build assets: long cache.
    location ^~ /assets/ {
        include /etc/nginx/snippets/seo-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Old URLs → new pages (301). One exact line per mapped URL (list in seo/redirects.md).
    location = /old-page { return 301 /new-page; }

    # Prerendered pages: /path → /path/index.html; real 404 otherwise.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
    error_page 404 /404.html;
}
